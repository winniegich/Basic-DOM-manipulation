<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1 class="title">Counter</h1>
    <div id="count-display" class="display">0</div>
    
    <div class="button-group">
      <button id="decrement-btn" class="btn btn-secondary" aria-label="Decrement count" disabled>-</button>
      <button id="reset-btn" class="btn btn-outline" aria-label="Reset count">Reset</button>
      <button id="increment-btn" class="btn btn-primary" aria-label="Increment count">+</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
